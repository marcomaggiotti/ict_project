# Standalone compose file for running/developing this service in isolation
# (outside the top-level platform docker-compose.yml). Useful once this folder
# is migrated to its own repository.
services:
  calendar-service:
    build: .
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      DB_BACKEND: ${DB_BACKEND:-sqlite}

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendar_db
    ports:
      - "5435:5432"
    volumes:
      - calendar_postgres_data:/var/lib/postgresql/data

volumes:
  calendar_postgres_data:
